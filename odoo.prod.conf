# odoo.prod.conf — production Odoo configuration for HRMS.
#
# This file is COMMITTED. It carries no secrets: the two that exist
# (admin_passwd, db_password) live in Secret Manager and are injected at
# container start by scripts/render_odoo_conf.sh, which writes the assembled
# file to tmpfs. The rendered result never touches the persistent disk, so it
# never lands in a disk snapshot.
#
# Placeholders below are substituted verbatim by that script.
#
# WHAT THIS REPLACES. Until now the entire production config existed in exactly
# two places: a file in a personal home directory on the VM
# (/home/tech/odoo-project/odoo.conf, mode 644, containing a live database
# password in cleartext) and a GitHub Actions secret named ODOO_CONF, written to
# disk on every deploy. Nobody could review a change to it, and nobody did.
#
# Three defects were carried over from that file DELIBERATELY UNFIXED, and three
# were fixed. Both sets are annotated below, because the difference matters: the
# fixes are the point of making this reviewable, and the non-fixes are things
# that need their own change with their own verification.

[options]

# ── Secrets, injected at runtime ───────────────────────────────────────────────
#
# admin_passwd was COMMENTED OUT in the live config. With no value set, Odoo
# falls back to its built-in default master password. list_db = False below gates
# the database manager UI, so this was not an open door — but it was one config
# change away from being one, and there is no reason to leave the question open.
#
# It now holds a 40-character random value from Secret Manager.
admin_passwd = __ADMIN_PASSWD__

# The live value is FOUR CHARACTERS, and is the `odoo` default that
# docker-compose.yml published as `${DB_PASSWORD:-odoo}` in a PUBLIC repository.
# It is in git history forever, so deleting the line was never the fix.
#
# Seeded into Secret Manager as-is so this file renders a WORKING config
# immediately. Rotating it to a strong value is a separate, deliberate step —
# see infrastructure/rotate_db_password.sh — and it cannot run until the VM has
# cloud-platform scope and secretAccessor (Phase 4b), because the script reads
# the secret from the VM itself.
db_password = __DB_PASSWORD__

# ── Database ───────────────────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = odoo
db_sslmode = prefer

# ── FIXED: the instance is now pinned to one database ──────────────────────────
#
# The live config set `dbfilter = ^.*$` with NO db_name — "allows all databases
# (can be restricted later)". There is exactly one database on this server,
# confirmed on the box: odoo_hrms_db (plus postgres/template0/template1).
#
# dbfilter + list_db are the two settings that close the database manager.
# Without list_db = False, Odoo serves /web/database/manager to ANY
# unauthenticated request, and that page will back up and download the entire
# database, duplicate it, restore over it, or drop it — with only admin_passwd
# in front of it, unrate-limited. list_db was ALREADY False here, which is the
# important half and was already right. dbfilter now pins the instance so the
# selector cannot enumerate anything else.
db_name = odoo_hrms_db
dbfilter = ^odoo_hrms_db$
list_db = False

# ── FIXED: db_maxconn, which the live value oversubscribes 10x ─────────────────
#
# The live config sets db_maxconn = 64 against `max_connections = 60` in
# docker-compose.yml. That is not a 4-connection overshoot; it is roughly 10x.
#
# db_maxconn is PER PROCESS — odoo/sql_db.py builds the pool as a module-level
# global. Critically there are TWO pools, _Pool and _Pool_readonly, and http.py
# takes a readonly cursor on EVERY request. With no db_replica_host configured,
# connection_info_for() falls back to the primary, so those are separate
# physical connections to the same Postgres.
#
# Process count, per odoo/service/server.py process_spawn():
#     workers          -> that many WorkerHTTP          = 3
#     max_cron_threads -> that many WorkerCron          = 1
#     plus ONE long-polling (gevent) process             = 1
#                                                   total 5
#
# So the ceiling is 2 x db_maxconn per process, not one:
#     live:  5 x 2 x 64 = 640   against max_connections = 60
#     here:  5 x 2 x  5 =  50   against max_connections = 60
#
# 50 also clears Postgres's superuser_reserved_connections (3 by default), so
# the usable ceiling is 57 and there is real headroom rather than an exact fit.
#
# CHECKED BEFORE CHANGING, not assumed: `docker logs odoo-db` over the last 30
# days contains ZERO "too many clients" entries. Pools fill lazily and this
# instance's load is low, so the live setting has not bitten. It presents as
# intermittent `FATAL: sorry, too many clients already` under load, which reads
# like an application bug for weeks. This is a latent trap being closed, not an
# outage being fixed.
db_maxconn = 5

# ── HTTP ───────────────────────────────────────────────────────────────────────
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

# Odoo sits behind Traefik, which terminates TLS. Without this, Odoo builds
# redirect and asset URLs from the internal request and every absolute link is
# wrong. Note the live docker-compose.yml also sets an ODOO_PROXY=true
# environment variable, which nothing reads — proxy_mode here is the real
# setting, and that variable is removed in Phase 3.
proxy_mode = True

# ── FIXED: the addons path, which Docker was about to hide ─────────────────────
#
# The live value is `/mnt/extra-addons/custom,...` and works TODAY only because
# docker-compose.yml bind-mounts ./custom_addons over that path.
#
# The odoo:19.0 base image declares
#     VOLUME ["/mnt/extra-addons", "/var/lib/odoo"]
# — verified directly with `docker image inspect`. So at runtime Docker mounts an
# ANONYMOUS EMPTY VOLUME over /mnt/extra-addons and silently hides anything baked
# beneath it. The bind mount is the only thing masking that.
#
# Phase 3 removes the bind mount, because it is what makes an image tag a lie:
# two containers running the same image SHA can be running different application
# code depending on what the VM has checked out, and re-pinning a previous image
# leaves the new addons sitting on disk, still mounted. Removing the mount
# WITHOUT this path change takes the site down — the addons simply vanish, with
# no build error and no failed health check.
#
# /opt is not a declared volume, so code baked there survives.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/cleardeals-addons
data_dir = /var/lib/odoo

# ── Workers (prefork) ──────────────────────────────────────────────────────────
#
# Unchanged from the live config: 3 HTTP workers, 1 cron thread, on an e2-medium
# (2 shared vCPU, 4 GB). A machine-type change is out of scope for this
# migration and there is no evidence it is needed.
#
# With workers > 0 the websocket bus runs in a SEPARATE gevent process on :8072,
# so the /websocket route in docker-compose.yml is load-bearing — without it
# every realtime update in the UI stops silently, with no error in any log. That
# route is already present and correct.
workers = 3
max_cron_threads = 1

# ── NOT CHANGED, deliberately: the memory limits ───────────────────────────────
#
# 512 MB soft / 640 MB hard look low. These are VIRTUAL memory limits
# (RLIMIT_AS), and on the CRM instance measured per-worker VIRT was 663-727 MB
# against 141-182 MB RSS — i.e. numbers of this shape do trip that ceiling.
#
# So this was checked rather than reasoned about: `docker logs odoo-app` over the
# last 30 days contains ZERO "virtual memory limit reached" entries. Workers are
# not being recycled, so the limits are not biting on this workload.
#
# Left exactly as they are. Changing a limit on the strength of an analogy to a
# different machine, against evidence from this one, is how a working system gets
# broken. Revisit once Phase 6 makes real memory metrics exist — which is the
# first time there will be data to decide on.
limit_memory_soft = 536870912
limit_memory_hard = 671088640
limit_request = 8192
limit_time_cpu = 900
limit_time_real = 1800

# ── Modules ────────────────────────────────────────────────────────────────────
server_wide_modules = base,web

# ── Logging ────────────────────────────────────────────────────────────────────
# No logfile: Odoo logs to stdout/stderr so Docker's json-file driver captures
# it, which is what the Ops Agent then ships to Cloud Logging (Phase 6). Setting
# logfile here would write to a path inside the container and make the logs
# invisible to both.
log_level = info

# ── Misc ───────────────────────────────────────────────────────────────────────
unaccent = True
