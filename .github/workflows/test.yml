name: Run Odoo Tests

on:
  push:
    branches: ['development', 'main']
  pull_request:
    branches: ['main']

jobs:
  # Cheap, fast gate: the OpenAPI specifications must be well-formed AND must
  # describe exactly the routes the controllers expose. Runs without Docker or a
  # database, so it reports drift in well under a minute.
  #
  # This job is deliberately part of "Run Odoo Tests" rather than a workflow of
  # its own: deploy.yml triggers on this workflow completing successfully, so a
  # specification that has drifted from the code blocks the deploy.
  api-docs:
    name: OpenAPI Specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tooling
        run: pip install --quiet pyyaml openapi-spec-validator

      - name: Validate specifications are well-formed
        run: |
          python -m openapi_spec_validator \
            docs/api/hr_employee_cleardeals.openapi.yaml \
            docs/api/document_template_manager.openapi.yaml

      # Validation only proves the documents are well-formed -- a specification
      # describing an API that does not exist validates perfectly. This step is
      # the one that catches drift.
      - name: Check specifications match the controllers
        run: python docs/api/check_route_parity.py

  test:
    name: Test Custom Modules
    runs-on: ubuntu-latest

    # Database service for Odoo to connect to during testing phase
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo_test_db
        ports:
          - 5432:5432
        # Health check ensures DB is ready before Odoo starts
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Odoo Docker Image
        run: docker build -t my-odoo-image .

      - name: List repository structure
        run: |
          echo "Repository structure:"
          ls -la ${{ github.workspace }}
          echo "---"
          echo "Custom addons directory:"
          ls -la ${{ github.workspace }}/custom_addons/ || echo "custom_addons not found"
          echo "---"
          echo "Looking for module manifests:"
          find ${{ github.workspace }}/custom_addons -name "__manifest__.py" -o -name "__openerp__.py" || echo "No manifests found"

      - name: Run Odoo Tests
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/custom_addons:/mnt/extra-addons \
            -e HOST=localhost \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            my-odoo-image \
            odoo -d odoo_test_db \
            --db_host=localhost \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            -i hr_employee_cleardeals,document_template_manager \
            --test-enable \
            --test-tags /hr_employee_cleardeals,/document_template_manager \
            --stop-after-init \
            --log-level=test
